<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GÓC – Phê & Trà | Chuyển hướng</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      // Chuyển hướng các URL con về index.html kèm hash tương ứng
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/';
      
      // Lấy phần path sau repoName
      var remainingPath = l.pathname.replace('/' + repoName, '');
      if (remainingPath && remainingPath !== '/') {
        redirectUrl += '#' + remainingPath + l.search + l.hash;
      }
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Đang chuyển hướng về GÓC POS...</p>
  </body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23214E34'><path d='M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#214E34" />
    <meta name="description" content="GÓC – Phê & Trà Mobile POS System - Quản lý bàn, gọi món và thanh toán nhanh chóng" />
    <title>GÓC – Phê & Trà | Mobile POS</title>
    
    <!-- PWA & Mobile Web Capabilities -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GÓC POS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO & Social Metadata -->
    <link rel="canonical" href="https://gocpos.vn/" />
    <meta property="og:title" content="GÓC – Phê & Trà | Mobile POS" />
    <meta property="og:description" content="Hệ thống bán hàng và quản lý quán cà phê & trà GÓC POS" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./default-logo.png" />

    <!-- Preload critical hero image for instant LCP -->
    <link rel="preload" as="image" href="./images/login/barista-3d.webp" type="image/webp" fetchpriority="high">

    <!-- Google Fonts: Inter & JetBrains Mono (Non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
    </noscript>
  </head>
  <body class="bg-[#F4F6F4] text-[#1A261D] antialiased selection:bg-forest-800 selection:text-white">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:px-3 focus:py-1.5 focus:bg-[#214E34] focus:text-white focus:rounded-lg focus:font-bold focus:text-xs focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-white">
      Chuyển đến nội dung chính
    </a>
    <div id="root">
      <main class="min-h-[100dvh] flex flex-col justify-center items-center px-4 py-2 relative overflow-hidden" style="background: radial-gradient(circle at 10% 8%, rgba(254, 215, 226, 0.5) 0%, transparent 35%), radial-gradient(circle at 92% 12%, rgba(219, 234, 254, 0.6) 0%, transparent 40%), radial-gradient(circle at 50% 95%, rgba(209, 250, 229, 0.4) 0%, transparent 45%), #F5F7F4;">
        <div class="relative z-10 w-full max-w-[360px] sm:max-w-[390px] flex flex-col items-center my-auto py-1 sm:py-3">
          <div class="text-center mb-1 select-none">
            <h1 class="text-2xl sm:text-3xl font-black text-[#1C412C] tracking-tight leading-none drop-shadow-xs">GÓC POS</h1>
            <p class="text-[11px] sm:text-xs font-semibold text-[#526658] mt-1 tracking-normal">Hệ thống POS Vận hành &amp; Bán hàng</p>
          </div>
          <div class="relative z-20 flex justify-center -mb-4 sm:-mb-5 pointer-events-none select-none">
            <img src="./images/login/barista-3d.webp" alt="3D Coffee Barista" class="w-32 sm:w-40 md:w-44 h-auto max-h-[135px] object-contain drop-shadow-md select-none" width="160" height="160" fetchpriority="high">
          </div>
          <div class="relative z-10 w-full bg-white p-4 sm:p-6 pt-5 sm:pt-6 space-y-3.5 shadow-xl rounded-3xl">
            <div class="text-center space-y-0.5">
              <h2 class="text-lg sm:text-xl font-black text-[#1C412C] tracking-wide uppercase">LOGIN</h2>
              <p class="text-[11px] sm:text-xs text-[#4F6255] font-medium leading-relaxed">Nhập tài khoản nhân viên được cấp để mở ca làm việc</p>
            </div>
            <div class="py-6 flex justify-center">
              <div class="w-6 h-6 border-2 border-[#214E34] border-t-transparent rounded-full animate-spin"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
